<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ryuusutaru - 星を、歌に。</title>
  <style>
    :root {
      --bg-color: #080a10;
      --card-bg: rgba(255, 255, 255, 0.035);
      --card-inner-bg: rgba(255, 255, 255, 0.025);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.88);
      --text-muted: rgba(255, 255, 255, 0.5);
      --accent-blue: #3b82f6;
      --nav-height: 64px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.8;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Header Navigation */
    header {
      height: var(--nav-height);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1.2rem;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      background: rgba(8, 10, 16, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .menu-icon {
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--text-main);
      user-select: none;
      padding: 4px 6px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .menu-icon:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-main);
      text-decoration: none;
    }

    /* 側邊欄背景遮罩 Overlay */
    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .menu-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* 左側滑出 Menu */
    .sidebar-drawer {
      position: fixed;
      top: 0;
      left: -320px;
      width: 280px;
      max-width: 80vw;
      height: 100vh;
      background: #0d101a;
      border-right: 1px solid var(--border-color);
      z-index: 201;
      padding: 2rem 1.8rem;
      display: flex;
      flex-direction: column;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 10px 0 35px rgba(0, 0, 0, 0.6);
    }

    .sidebar-drawer.active {
      left: 0;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 2.2rem;
    }

    .sidebar-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .close-btn {
      font-size: 1.3rem;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
      padding: 4px;
    }

    .close-btn:hover {
      color: var(--text-main);
    }

    .sidebar-menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
    }

    .sidebar-menu a {
      color: var(--text-main);
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      display: block;
      transition: color 0.2s;
    }

    .sidebar-menu a:hover {
      color: var(--accent-blue);
    }

    /* Language Switcher Pills */
    .lang-switcher {
      display: flex;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 4px 12px;
      font-size: 0.8rem;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .lang-btn.active {
      background: #ffffff;
      color: #000000;
      font-weight: 600;
    }

    /* 滿版一頁式區塊控制 */
    .page-section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: calc(var(--nav-height) + 1.5rem) 1.2rem 3rem 1.2rem;
    }

    .hero-content {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .hero-content h1 {
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: 5px;
      margin-bottom: 1.2rem;
      color: var(--text-main);
      text-align: center;
    }

    .hero-content .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-align: center;
    }

    /* 標題與藍色底線設計 */
    .section-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .section-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 1.5px;
      margin-bottom: 0.6rem;
    }

    .title-underline {
      width: 32px;
      height: 3px;
      background-color: var(--accent-blue);
      margin: 0 auto;
      border-radius: 2px;
    }

    /* 卡片設計 */
    .card {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.8rem 1.6rem;
      backdrop-filter: blur(12px);
    }

    .bio-content {
      white-space: pre-line;
      color: var(--text-sub);
      font-size: 0.98rem;
      line-height: 2;
    }

    /* 通知卡片內部格式 */
    .news-date {
      color: var(--accent-blue);
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 1.2rem;
      letter-spacing: 0.5px;
    }

    .news-body {
      color: var(--text-sub);
      font-size: 0.95rem;
      line-height: 1.9;
      white-space: pre-line;
    }

    /* Works 作品框 */
    .work-item {
      background: var(--card-inner-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.2rem 1.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .work-title {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    /* Social Links */
    .social-links {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      padding: 0.8rem 1.5rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      text-decoration: none;
      border-radius: 12px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Floating Back to Top Button */
    .back-to-top {
      position: fixed;
      bottom: 2rem;
      right: 1.5rem;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 1.1rem;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
      z-index: 90;
    }

    .back-to-top:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    footer {
      text-align: center;
      margin-top: 2.5rem;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <!-- Header Navigation -->
  <header>
    <div class="nav-left">
      <span class="menu-icon" id="menu-btn" onclick="toggleMenu()">≡</span>
      <a href="#top" class="logo">ryuusutaru</a>
    </div>
    <div class="lang-switcher">
      <button class="lang-btn" id="btn-tc" onclick="setLang('tc')">繁中</button>
      <button class="lang-btn" id="btn-jp" onclick="setLang('jp')">日本語</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </header>

  <!-- 左側滑出側邊欄與遮罩 -->
  <div class="menu-overlay" id="menu-overlay" onclick="toggleMenu()"></div>
  <aside class="sidebar-drawer" id="sidebar-drawer">
    <div class="sidebar-header">
      <span class="sidebar-title">Menu</span>
      <span class="close-btn" onclick="toggleMenu()">✕</span>
    </div>
    <ul class="sidebar-menu">
      <li><a href="#top" onclick="toggleMenu()" id="menu-home">主頁</a></li>
      <li><a href="#about-sec" onclick="toggleMenu()" id="menu-about">介紹</a></li>
      <li><a href="#news-sec" onclick="toggleMenu()" id="menu-news">通知</a></li>
      <li><a href="#works-sec" onclick="toggleMenu()" id="menu-works">作品</a></li>
      <li><a href="#links-sec" onclick="toggleMenu()" id="menu-links">Links</a></li>
    </ul>
  </aside>

  <!-- HOME SECTION -->
  <section class="page-section" id="top">
    <div class="hero-content">
      <h1>星を、歌に。</h1>
      <p class="subtitle" id="site-subtitle">公式サイト</p>
    </div>
  </section>

  <!-- ABOUT SECTION -->
  <section class="page-section" id="about-sec">
    <div class="section-header">
      <h2 class="section-title" id="about-title">介紹</h2>
      <div class="title-underline"></div>
    </div>
    <div class="card">
      <div class="bio-content" id="bio-text"></div>
    </div>
  </section>

  <!-- NEWS SECTION -->
  <section class="page-section" id="news-sec">
    <div class="section-header">
      <h2 class="section-title" id="news-title">通知</h2>
      <div class="title-underline"></div>
    </div>
    <div class="card">
      <div class="news-date">2026/10/04</div>
      <div class="news-body" id="news-body-text"></div>
    </div>
  </section>

  <!-- WORKS SECTION -->
  <section class="page-section" id="works-sec">
    <div class="section-header">
      <h2 class="section-title" id="works-title">作品</h2>
      <div class="title-underline"></div>
    </div>
    <div class="card">
      <div class="work-item">
        <span class="work-title" id="song-title">等待流星的到來⋯⋯</span>
      </div>
    </div>
  </section>

  <!-- LINKS SECTION -->
  <section class="page-section" id="links-sec">
    <div class="section-header">
      <h2 class="section-title" id="links-title">Links</h2>
      <div class="title-underline"></div>
    </div>
    <div class="card">
      <div class="social-links">
        <a href="https://x.com/sutaru_music?s=11" target="_blank" rel="noopener noreferrer" class="social-btn">
          <span>X (Twitter)</span>
        </a>
        <a href="https://www.instagram.com/ryuusutaru_music?stkn=MTlnNzE3ejhjd3RtdQ%3D%3D&utm_source=qr" target="_blank" rel="noopener noreferrer" class="social-btn">
          <span>Instagram</span>
        </a>
        <a href="https://www.threads.com/@ryuusutaru_music?igshid=NTc4MTIwNjQ2YQ==" target="_blank" rel="noopener noreferrer" class="social-btn">
          <span>Threads</span>
        </a>
      </div>
      <footer>
        &copy; 2026 ryuusutaru. All rights reserved.
      </footer>
    </div>
  </section>

  <!-- Floating Back to Top Button -->
  <a href="#top" class="back-to-top" title="Back to Top">↑</a>

  <script>
    const bios = {
      jp: `台湾の高校生です\n音楽を作っています\nVOCALOID / 初音ミク\n\n星から、流星へ\nいつか、誰かの心に残る曲を\n\nよろしくお願いします`,
      tc: `來自台灣的高中生\n音樂製作中\nVOCALOID / 初音未來\n\n從星星，邁向流星\n希望能創做出留存在某人心中的歌曲\n\n請多指教`,
      en: `High school student from Taiwan.\nCreating music.\nVOCALOID / Hatsune Miku\n\nFrom stars to shooting stars.\nCreating music that stays in someone's heart forever.\n\nNice to meet you.`
    };

    const newsData = {
      tc: `你好，先謝謝你來到我的網站。\n\n我是一個台灣的高中生，想在空閒時間做一點歌曲。\n\n之後也請多多指教。`,
      jp: `こんにちは、サイトにお越しいただきありがとうございます。\n\n台湾の高校生で、空き時間に曲を作りたいと思っています。\n\nこれからよろしくお願いします。`,
      en: `Hello, thank you for visiting my website.\n\nI am a high school student from Taiwan, creating music in my spare time.\n\nNice to meet you all.`
    };

    const i18n = {
      jp: { home: "ホーム", subtitle: "公式サイト", about: "紹介", news: "通知", works: "作品", links: "Links", song: "流星の訪れを待つ……" },
      tc: { home: "主頁", subtitle: "官方網站", about: "介紹", news: "通知", works: "作品", links: "Links", song: "等待流星的到來⋯⋯" },
      en: { home: "Home", subtitle: "Official Site", about: "About", news: "News", works: "Works", links: "Links", song: "Waiting for the Meteor's Arrival..." }
    };

    function setLang(lang) {
      localStorage.setItem('ryuu_lang', lang);

      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${lang}`).classList.add('active');

      document.getElementById('bio-text').innerText = bios[lang] || bios.jp;
      document.getElementById('news-body-text').innerText = newsData[lang] || newsData.tc;
      
      const text = i18n[lang] || i18n.tc;
      document.getElementById('site-subtitle').innerText = text.subtitle;
      document.getElementById('about-title').innerText = text.about;
      document.getElementById('news-title').innerText = text.news;
      document.getElementById('works-title').innerText = text.works;
      document.getElementById('links-title').innerText = text.links;
      document.getElementById('song-title').innerText = text.song;

      document.getElementById('menu-home').innerText = text.home;
      document.getElementById('menu-about').innerText = text.about;
      document.getElementById('menu-news').innerText = text.news;
      document.getElementById('menu-works').innerText = text.works;
      document.getElementById('menu-links').innerText = text.links;
    }

    function toggleMenu() {
      const drawer = document.getElementById('sidebar-drawer');
      const overlay = document.getElementById('menu-overlay');
      drawer.classList.toggle('active');
      overlay.classList.toggle('active');
    }

    // 預設語言為繁體中文
    const initialLang = localStorage.getItem('ryuu_lang') || 'tc';
    setLang(initialLang);
  </script>
</body>
</html>
