<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ryuusutaru Official Website</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161f30;
      --accent-color: #39c5bb;
      --text-color: #e0e6ed;
      --text-sub: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding-bottom: 60px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background: rgba(11, 15, 25, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .logo { font-size: 1.4rem; font-weight: bold; color: #fff; letter-spacing: 1px; }
    .logo span { color: var(--accent-color); }
    .lang-btn {
      background: transparent;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-left: 4px;
    }
    .lang-btn.active {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    .hero {
      text-align: center;
      padding: 2.5rem 0 1.5rem 0;
    }
    .hero h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      color: #fff;
    }
    .hero p.tagline {
      color: var(--accent-color);
      font-size: 1.05rem;
      letter-spacing: 1px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.8rem;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .card h2 {
      font-size: 1.25rem;
      color: var(--accent-color);
      margin-bottom: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 0.5rem;
    }
    .bio-text {
      white-space: pre-line;
      font-size: 1rem;
      color: var(--text-color);
      line-height: 1.8;
    }
    .social-links {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .social-btn {
      display: inline-flex;
      align-items: center;
      padding: 10px 20px;
      background: #222e45;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.2s;
      font-weight: 500;
    }
    .social-btn:hover {
      background: var(--accent-color);
      color: #000;
    }
    .news-item {
      margin-bottom: 0.5rem;
    }
    .news-date {
      font-size: 0.85rem;
      color: var(--text-sub);
    }
    footer {
      text-align: center;
      color: var(--text-sub);
      font-size: 0.85rem;
      margin-top: 3rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">ryuu<span>sutaru</span></div>
    <div>
      <button class="lang-btn" id="btn-jp" onclick="setLang('jp')">JP</button>
      <button class="lang-btn" id="btn-tc" onclick="setLang('tc')">繁中</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </header>

  <div class="container">
    <section class="hero">
      <h1>ryuusutaru</h1>
      <p class="tagline">星から、流星へ。</p>
    </section>

    <!-- ABOUT -->
    <section class="card" id="about">
      <h2 id="about-title">About</h2>
      <div class="bio-text" id="bio-content"></div>
    </section>

    <!-- NEWS -->
    <section class="card" id="news">
      <h2 id="news-title">News</h2>
      <div class="news-item">
        <div class="news-date">2026.10.04</div>
        <p id="news-content">ryuusutaru 公式サイトオープン！</p>
      </div>
    </section>

    <!-- WORKS -->
    <section class="card" id="works">
      <h2 id="works-title">Works</h2>
      <p id="works-content">Coming Soon...</p>
    </section>

    <!-- LINKS -->
    <section class="card" id="links">
      <h2 id="links-title">Links</h2>
      <div class="social-links">
        <a href="https://www.instagram.com/ryuusutaru_music?stkn=MTlnNzE3ejhjd3RtdQ%3D%3D&utm_source=qr" target="_blank" rel="noopener noreferrer" class="social-btn">Instagram</a>
      </div>
    </section>

    <footer>
      &copy; 2026 ryuusutaru. All rights reserved.
    </footer>
  </div>

  <script>
    const bios = {
      jp: `台湾の高校生です\n音楽を作っています\nVOCALOID / 初音ミク\n\n星から、流星へ\nいつか、誰かの心に残る曲を\n\nよろしくお願いします`,
      tc: `來自台灣的高中生\n音樂製作中\nVOCALOID / 初音未來\n\n從星星，邁向流星\n希望能創作出留存在某人心中的歌曲\n\n請多指教`,
      en: `High school student from Taiwan.\nCreating music.\nVOCALOID / Hatsune Miku\n\nFrom stars to shooting stars.\nCreating music that stays in someone's heart forever.\n\nNice to meet you.`
    };

    const translations = {
      jp: {
        aboutTitle: "About",
        newsTitle: "News",
        newsContent: "ryuusutaru 公式サイトオープン！",
        worksTitle: "Works",
        worksContent: "Coming Soon...",
        linksTitle: "Links"
      },
      tc: {
        aboutTitle: "關於我",
        newsTitle: "最新消息",
        newsContent: "ryuusutaru 官方網站正式上線！",
        worksTitle: "作品集",
        worksContent: "即將推出...",
        linksTitle: "社群連結"
      },
      en: {
        aboutTitle: "About",
        newsTitle: "News",
        newsContent: "ryuusutaru Official Site Launched!",
        worksTitle: "Works",
        worksContent: "Coming Soon...",
        linksTitle: "Links"
      }
    };

    function setLang(lang) {
      localStorage.setItem('sutaru_lang', lang);
      
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${lang}`).classList.add('active');

      document.getElementById('bio-content').innerText = bios[lang] || bios.jp;
      
      const t = translations[lang] || translations.jp;
      document.getElementById('about-title').innerText = t.aboutTitle;
      document.getElementById('news-title').innerText = t.newsTitle;
      document.getElementById('news-content').innerText = t.newsContent;
      document.getElementById('works-title').innerText = t.worksTitle;
      document.getElementById('works-content').innerText = t.worksContent;
      document.getElementById('links-title').innerText = t.linksTitle;
    }

    const savedLang = localStorage.getItem('sutaru_lang') || 'jp';
    setLang(savedLang);
  </script>
</body>
</html>
